# builds single-file executables for windows and linux.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          for RID in win-x64 linux-x64; do
            dotnet publish ModManager/ModManager.csproj -c Release -r "$RID" --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true \
              -p:InvariantGlobalization=true \
              -p:DebugType=none \
              -p:Version="$VERSION" \
              -o "out/$RID"
          done
          mkdir dist
          cp out/win-x64/ModManager.exe dist/RivellonModManager-win-x64.exe
          # tar keeps the executable permission, a plain download would lose it
          cp out/linux-x64/ModManager out/RivellonModManager
          tar -czf dist/RivellonModManager-linux-x64.tar.gz -C out RivellonModManager

      - uses: actions/upload-artifact@v4
        with:
          name: RivellonModManager
          path: dist/*

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
